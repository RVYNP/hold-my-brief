# Cross-platform CI for Hold My Brief.
#
# The point of this file is that the SAME suite runs on Windows and macOS. That
# matters because the app is a Tauri desktop app whose webview is different on
# every OS (WebView2/Chromium on Windows, WKWebView on macOS), and because the
# test harness used to be Windows-only: playwright.config.ts hardcoded
# channel 'msedge' and the smoke scripts hardcoded dist/Hold My Brief.exe.
#
# No secrets are used and nothing is published. Each job only builds and tests;
# the unsigned Windows installer is kept as a short-lived workflow artifact.
#
# Layout, per OS: three e2e shards, `checks` and `build`, all starting together.
# No job `needs:` another and no matrix is computed by an earlier job: the agent
# loop merges when every check run on the head SHA is green, so a job that waits
# on another may not have a check run yet when the rest finish. Keep it that way,
# and add no `paths-ignore` (see .github/loop.json `ciOptionalPaths`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Browser end-to-end tests, split in three shards balanced by the per-file seconds in
  # e2e/timings.json (scripts/e2e-shard.mjs). One Playwright worker per machine: more
  # workers on one runner made zoom.spec.ts flaky under load.
  e2e:
    name: ${{ matrix.label }} · e2e (${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
        include:
          # Windows needs no browser download: Edge is the WebView2 runtime and is
          # always present on windows-latest.
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # playwright.config.ts prefers a branded Chrome/Edge and falls back to a
        # cached Chromium build; windows-latest has Edge, macOS must download
        # Chromium. --with-deps installs the OS libraries Playwright needs.
        if: runner.os == 'macOS'
        run: npx playwright install --with-deps chromium

      - name: Shard spec list and how to reproduce it
        env:
          PR: ${{ github.event.pull_request.number || '<PR>' }}
        run: |
          files=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 3)
          echo "Shard ${{ matrix.shard }}/3 runs $(echo "$files" | wc -w | tr -d ' ') spec files:"
          echo "$files"
          echo
          echo "Reproduce this shard locally:"
          echo "E2E_PORT=\$((20000 + $PR)) npx playwright test $(echo $files)"

      - name: Browser end-to-end tests (shard ${{ matrix.shard }}/3)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
        run: npx playwright test --workers=1 --reporter=list,json $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 3)

      # The JSON report is what scripts/e2e-timings.mjs turns into e2e/timings.json.
      - name: Keep the e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ runner.os }}-${{ matrix.shard }}
          path: e2e-report.json
          if-no-files-found: warn
          retention-days: 7

  # Unit tests, the text layout check and the Rust tests (test profile).
  checks:
    name: ${{ matrix.label }} · checks
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Keyed per OS and per job: `checks` builds test profiles, `build` builds release,
      # and each must not overwrite the other's cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-checks

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # The layout check launches a browser; see the e2e job.
        if: runner.os == 'macOS'
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Text layout anchor check
        run: npm run test:layout

      - name: Rust unit tests (locked)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # The frontend build and the one release compile. `tauri build` runs `npm run build`
  # (beforeBuildCommand: foliate patch, tsc, vite build) and compiles the release binary
  # with custom-protocol itself; Windows' native smoke then runs on that binary.
  # tauri::generate_context! embeds `bundle.frontendDist` ("../dist") at compile time,
  # which is why the frontend is built first.
  build:
    name: ${{ matrix.label }} · build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundles: nsis
          - os: macos-latest
            label: macOS
            bundles: app
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-build

      - name: Install dependencies
        run: npm ci

      # Windows: tauri.windows.conf.json narrows bundling to NSIS, the Windows deliverable.
      # macOS: only the .app bundle is built; CI never launches it.
      - name: Build the frontend, the release binary and the ${{ matrix.label }} bundle
        run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked

      # WebView2 honours a remote-debugging port, so on Windows the smoke scripts drive
      # the real release binary over CDP: embedded UI, CLI open, IPC, pin, lock, save,
      # raw-byte transport and clean close. The MSVC build links the WebView2 loader
      # statically, so the binary runs from the target directory.
      #
      # GitHub's Windows runners are elevated, and WebView2 Runtime 150+ ignores
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS for elevated hosts by design
      # (tauri-apps/wry#1782, MicrosoftEdge/WebView2Feedback#5645). HKLM policy is still
      # honoured, so the runner opens the same port through the per-executable policy.
      - name: Open WebView2 CDP for the smoke test (runner-only policy)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'hold-my-brief.exe' -Value '--remote-debugging-port=19126' -PropertyType String -Force | Out-Null

      - name: Native smoke test (WebView2)
        if: runner.os == 'Windows'
        env:
          HOLD_MY_BRIEF_BINARY: src-tauri/target/release/hold-my-brief.exe
        run: npm run test:native

      - name: Keep the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hold-my-brief-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
